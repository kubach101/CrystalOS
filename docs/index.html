<!doctypehtml>
    <html lang=pl>

    <head>
        <meta charset=utf-8>
        <title>Crystal OS</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2:wght@300;400;500&family=Inter:wght@300;400;500&display=swap"
            rel=stylesheet>
        <link href=icons/logo.svg rel=icon type=image/svg+xml>
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                background: #000;
                height: 100%;
                width: 100%;
                overflow: hidden;
                position: relative;
                font-family: "Exo 2", Inter, sans-serif
            }

            * {
                user-select: none
            }

            canvas#canvas {
                display: block;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                box-shadow: 0 0 40px rgba(0, 0, 0, .6);
                border: 2px solid #000;
                background: #000
            }

            .glass-panel {
                background: #2f2f2f6e;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 2px solid #afafaf8e;
                box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
                border-radius: 12px;
                color: #fff
            }

            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                width: 100px;
                padding: 12px;
                color: #fff;
                font-family: Orbitron, sans-serif;
                font-size: 20px;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 25px;
                z-index: 1
            }

            .app-icon {
                width: 60px;
                height: 60px
            }

            .app-btn {
                width: 60px;
                height: 60px;
                border-radius: 12px;
                border-width: 2px;
                border-style: solid;
                border-color: transparent
            }

            .app-btn.selected {
                border-color: #fff
            }

            .window {
                position: absolute;
                left: 50;
                top: 50;
                padding: 8px 20px;
                display: flex;
                flex-direction: column;
                align-items: center
            }

            .dragged {
                border-color: #fff
            }

            .header {
                width: 100%;
                height: 50px;
                padding: 12px 8px;
                color: #fff;
                font-family: Orbitron, sans-serif;
                font-size: 20px;
                text-align: left;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: top
            }

            textarea {
                user-select: all;
                resize: none;
                padding: 4px 12px;
                outline: 0;
                background: #5a5a5a;
                border: 2px solid #5a5a5a9e;
                border-radius: 12px;
                color: #fff;
                font-family: Orbitron, sans-serif;
                font-size: 15px;
                text-align: left
            }

            textarea:focus {
                border-color: #fff
            }

            textarea::selection {
                color: #000;
                background-color: #fff
            }

            input {
                resize: none;
                padding: 4px 12px;
                outline: 0;
                background: #5a5a5a;
                border: 2px solid #5a5a5a9e;
                border-radius: 12px;
                color: #fff;
                font-family: Orbitron, sans-serif;
                text-align: left
            }

            #wellcome-win {
                display: none;
                height: 50px;
                width: 360px
            }

            #calc-win {
                display: none;
                width: 380px;
                height: 420px;
                margin-bottom: 10px
            }

            #calc-input {
                width: 80%;
                height: 40px;
                font-size: 24px;
                box-sizing: border-box
            }

            .numpad {
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(4, 1fr);
                gap: 8px;
                width: 80%;
                aspect-ratio: 5/4;
                margin-top: 12px
            }

            .num-btn {
                display: flex;
                width: 100%;
                background: #5a5a5a;
                border: 2px solid #5a5a5a9e;
                border-radius: 20px;
                font-family: Orbitron, sans-serif;
                color: #fff;
                font-size: 12px;
                text-align: center;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                user-select: none
            }

            .equals {
                grid-row: span 2
            }

            .icon-symbol {
                font-family: "Segoe UI Symbol", "Noto Sans Symbols", "DejaVu Sans", "Arial Unicode MS", sans-serif
            }

            .num-btn:hover {
                border-color: #fff
            }

            #note-win {
                display: none;
                width: 500px;
                height: 400px
            }

            #note-textarea {
                width: 420px;
                height: 300px;
                font-size: 12px
            }

            #timer-win {
                display: none;
                width: 300px;
                height: 260px
            }

            #timer-display {
                display: flex;
                width: 80%;
                aspect-ratio: 3.5;
                background: #5a5a5a;
                border: 2px solid #5a5a5a9e;
                border-radius: 12px;
                font-family: Orbitron, sans-serif;
                color: #fff;
                font-size: 30px;
                text-align: center;
                justify-content: center;
                align-items: center;
                margin-bottom: 10px
            }

            #timer-menu {
                width: 80%;
                height: 60px;
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center
            }

            .timer-btn {
                width: 30%;
                height: 90%;
                background: #5a5a5a;
                border: 2px solid #5a5a5a9e;
                border-radius: 12px;
                font-family: Orbitron, sans-serif;
                color: #fff;
                display: block;
                justify-content: center;
                align-items: center
            }

            .timer-btn:hover {
                border-color: #fff
            }

            .timer-btn-icon {
                height: 90%;
                aspect-ratio: 1
            }

            #timer-slider {
                box-sizing: border-box;
                width: 80%;
                height: 6px;
                -webkit-appearance: none;
                appearance: none;
                background: 0 0;
                cursor: pointer;
                margin-top: 8px
            }

            #timer-slider::-webkit-slider-runnable-track {
                height: 6px;
                border-radius: 6px;
                background: #5a5a5a9e;
                border: 2px solid #5a5a5a9e
            }

            #timer-slider::-moz-range-track {
                height: 6px;
                border-radius: 6px;
                background: #5a5a5a9e;
                border: 2px solid #5a5a5a9e
            }

            #timer-slider::-moz-range-progress {
                height: 6px;
                border-radius: 6px 0 0 6px;
                background: #fff
            }

            #timer-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 20px;
                height: 20px;
                margin-top: -9px;
                border-radius: 50%;
                background: #fff;
                border: 2px solid #5a5a5a9e;
                box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
                transition: border-color .15s ease
            }

            #timer-slider::-webkit-slider-thumb:hover {
                border-color: #fff
            }

            #timer-slider::-moz-range-thumb {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #fff;
                border: 2px solid #5a5a5a9e;
                box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
                cursor: pointer;
                transition: border-color .15s ease
            }

            #timer-slider::-moz-range-thumb:hover {
                border-color: #fff
            }

            #timer-slider:focus {
                outline: 0
            }

            #timer-slider:focus::-webkit-slider-thumb {
                border-color: #fff
            }

            #settings-win {
                display: none;
                width: 400px;
                height: 600px
            }

            #settings-speed-label {
                width: 80%;
                margin-top: 20px;
                margin-bottom: 8px;
                font-size: 16px;
                text-align: left
            }

            #settings-speed-slider {
                box-sizing: border-box;
                width: 80%;
                height: 6px;
                -webkit-appearance: none;
                appearance: none;
                background: 0 0;
                cursor: pointer
            }

            #settings-speed-slider:disabled {
                cursor: not-allowed;
                opacity: .5
            }

            #settings-speed-slider::-webkit-slider-runnable-track {
                height: 6px;
                border-radius: 6px;
                background: #5a5a5a9e;
                border: 2px solid #5a5a5a9e
            }

            #settings-speed-slider::-moz-range-track {
                height: 6px;
                border-radius: 6px;
                background: #5a5a5a9e;
                border: 2px solid #5a5a5a9e
            }

            #settings-speed-slider::-moz-range-progress {
                height: 6px;
                border-radius: 6px 0 0 6px;
                background: #fff
            }

            #settings-speed-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 20px;
                height: 20px;
                margin-top: -9px;
                border-radius: 50%;
                background: #fff;
                border: 2px solid #5a5a5a9e;
                box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
                transition: border-color .15s ease
            }

            #settings-speed-slider::-webkit-slider-thumb:hover {
                border-color: #fff
            }

            #settings-speed-slider::-moz-range-thumb {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: #fff;
                border: 2px solid #5a5a5a9e;
                box-shadow: 0 2px 6px rgba(0, 0, 0, .5);
                cursor: pointer;
                transition: border-color .15s ease
            }

            #settings-speed-slider::-moz-range-thumb:hover {
                border-color: #fff
            }

            #settings-speed-slider:focus {
                outline: 0
            }

            #settings-speed-slider:focus::-webkit-slider-thumb {
                border-color: #fff
            }

            .header-btn {
                width: 24px;
                height: 24px;
                background: #5a5a5a;
                border: 2px solid #5a5a5a9e;
                border-radius: 4px;
                color: #fff;
                line-height: 24px;
                text-align: center;
                padding: 0;
                cursor: pointer
            }

            #clock {
                position: absolute;
                right: 0;
                top: 0;
                width: 200px;
                height: 80px;
                padding: 12px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                z-index: 1;
                text-align: center;
                font-size: 38px
            }

            .widget_text {
                color: #fff;
                font-family: Orbitron, sans-serif;
                font-size: 30px;
                text-align: center
            }
        </style>
    </head>

    <body><canvas height=1080 id=canvas oncontextmenu=event.preventDefault() width=1920></canvas>
        <div id=top style=display:none;z-index:1></div>
        <div class="glass-panel sidebar">
            <div class=widget_text>Apps</div>
            <div id=calc-btn class=app-btn><img class=app-icon src=icons/calculator.svg alt=Kalkulator></div>
            <div id=note-btn class=app-btn><img class=app-icon src=icons/notepad.svg alt=Notatnik></div>
            <div id=timer-btn class=app-btn><img class=app-icon src=icons/timer.svg alt=Timer></div>
            <div id=settings-btn class=app-btn><img class=app-icon src=icons/settings.svg alt=Ustawienia></div>
        </div>
        <div id=wellcome-win class="glass-panel window">
            <div id=wellcome-win-header class=header>Wellcome to Crystal OS!<div id=wellcome-close-btn class=header-btn>
                    ✕</div>
            </div>
        </div>
        <div id=calc-win class="glass-panel window">
            <div id=calc-win-header class=header>Calculator<div id=calc-close-btn class=header-btn>✕</div>
            </div><input id=calc-input class=text-area readonly>
            <div id=calc-numpad class=numpad><button class=num-btn>9</button> <button class=num-btn>8</button> <button
                    class=num-btn>7</button> <button class=num-btn>+</button> <button class=num-btn>C</button> <button
                    class=num-btn>6</button> <button class=num-btn>5</button> <button class=num-btn>4</button> <button
                    class=num-btn>−</button> <button class="num-btn icon-symbol">⌫</button> <button
                    class=num-btn>3</button> <button class=num-btn>2</button> <button class=num-btn>1</button> <button
                    class=num-btn>✕</button> <button class="num-btn equals">=</button> <button class=num-btn>0</button>
                <button class=num-btn>00</button> <button class=num-btn>.</button> <button class=num-btn>÷</button>
            </div>
        </div>
        <div id=note-win class="glass-panel window">
            <div id=note-win-header class=header>Notepad<div id=note-close-btn class=header-btn>✕</div>
            </div><textarea id=note-textarea spellcheck=false type=text></textarea>
        </div>
        <div id=timer-win class="glass-panel window">
            <div id=timer-win-header class=header>Timer<div id=timer-close-btn class=header-btn>✕</div>
            </div>
            <div id=timer-display></div>
            <div id=timer-menu><button class=timer-btn id=timer-start-btn><img class=timer-btn-icon
                        src=icons/play.svg></button> <button class=timer-btn id=timer-pause-btn><img
                        class=timer-btn-icon src=icons/pause.svg></button> <button class=timer-btn
                    id=timer-reset-btn><img class=timer-btn-icon src=icons/replay.svg></button></div><input
                id=timer-slider max=60 min=1 step=1 type=range value=5>
        </div>
        <div id=settings-win class="glass-panel window">
            <div id=settings-win-header class=header>Settings<div id=settings-close-btn class=header-btn>✕</div>
            </div>
            <div id=settings-speed-label class=widget_text>Rotation speed: <span id=settings-speed-value>1.0x</span>
            </div><input id=settings-speed-slider max=3 min=0 step=0.1 type=range value=1 disabled>
        </div>
        <div id=clock class=glass-panel>TIME</div>
        <script>var Module = { canvas: document.getElementById("canvas"), keyboardListeningElement: document.getElementById("canvas") }</script>
        <script src=script.js></script>
        <script src=main.js async></script>
    </body>

    </html>
