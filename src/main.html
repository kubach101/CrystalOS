<!doctypehtml><html lang=pl><head><meta charset=utf-8><title>Crystal OS</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2:wght@300;400;500&family=Inter:wght@300;400;500&display=swap"rel=stylesheet><style>body,html{margin:0;padding:0;background:#000;height:100%;width:100%;overflow:hidden;position:relative;font-family:'Exo 2',Inter,sans-serif}canvas#canvas{display:block;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);box-shadow:0 0 40px rgba(0,0,0,.6);border:2px solid #000;background:#000}.glass-panel{background:#2f2f2f6e;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:2px solid #afafaf8e;box-shadow:0 10px 40px rgba(0,0,0,.6);border-radius:12px;color:#fff}.sidebar{position:absolute;left:0;top:0;bottom:0;width:100px;padding:12px;color:#fff;font-family:Orbitron,sans-serif;font-size:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:25px;z-index:1}.app-icon{width:60px;height:60px}.app-btn{width:60px;height:60px;border-radius:12px;border-width:2px;border-style:solid;border-color:transparent}.app-btn.selected{border-color:#fff}.window{position:absolute;left:50;top:50;padding:8px 20px;display:flex;flex-direction:column;align-items:center}.window.dragged{border-color:#fff}.header{width:100%;height:50px;padding:12px 8px;color:#fff;font-family:Orbitron,sans-serif;font-size:20px;text-align:left;display:flex;flex-direction:row;justify-content:space-between;align-items:top}textarea{resize:none;padding:4px 12px;outline:0;background:#5a5a5a;border:2px solid #5a5a5a9e;border-radius:12px;color:#fff;font-family:Orbitron,sans-serif;font-size:15px;text-align:left}textarea:focus{border-color:#fff}textarea::selection{color:#000;background-color:#fff}input{resize:none;padding:4px 12px;outline:0;background:#5a5a5a;border:2px solid #5a5a5a9e;border-radius:12px;color:#fff;font-family:Orbitron,sans-serif;text-align:left}#calc-win{display:none;width:380px;height:420px;margin-bottom:10px}#calc-input{width:80%;height:40px;font-size:24px}.numpad{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(4,1fr);gap:8px;width:80%;aspect-ratio:5/4;margin-top:12px}.num-btn{display:flex;width:100%;background:#5a5a5a;border:2px solid #5a5a5a9e;border-radius:20px;font-family:Orbitron,sans-serif;color:#fff;font-size:12px;text-align:center;justify-content:center;align-items:center;cursor:pointer;user-select:none}.equals{grid-row:span 2}.icon-symbol{font-family:'Segoe UI Symbol','Noto Sans Symbols','DejaVu Sans','Arial Unicode MS',sans-serif}.num-btn:hover{border-color:#fff}#note-win{display:none;width:500px;height:400px}#note-textarea{width:420px;height:300px;font-size:12px}#timer-win{display:none;width:300px;height:260px}#timer-display{display:flex;width:80%;aspect-ratio:3.5;background:#5a5a5a;border:2px solid #5a5a5a9e;border-radius:20px;font-family:Orbitron,sans-serif;color:#fff;font-size:30px;text-align:center;justify-content:center;align-items:center;margin-bottom:10px}#timer-menu{width:80%;height:60px;display:flex;flex-direction:row;justify-content:space-between;align-items:center}.timer-btn{width:30%;height:90%;background:#5a5a5a;border:2px solid #5a5a5a9e;border-radius:12px;font-family:Orbitron,sans-serif;color:#fff;display:block;justify-content:center;align-items:center}.timer-btn:hover{border-color:#fff}.timer-btn-icon{height:90%;aspect-ratio:1}#timer-slider{width:80%;height:20px}#settings-win{display:none;width:400px;height:600px}.header-btn{width:24px;height:24px;background:#5a5a5a;border:2px solid #5a5a5a9e;border-radius:4px;color:#fff;line-height:24px;text-align:center;padding:0;cursor:pointer}.clock{position:absolute;right:0;top:0;width:200px;height:80px;padding:12px;display:flex;flex-direction:column;justify-content:center;z-index:1}.widget_text{color:#fff;font-family:Orbitron,sans-serif;font-size:30px;text-align:center}</style></head><body><canvas height=1080 id=canvas oncontextmenu=event.preventDefault() width=1920></canvas><div id=top style=display:none;z-index:1></div><div class="glass-panel sidebar"><div class=widget_text>Apps</div><div class=app-btn id=calc-btn><img class=app-icon src=icons/calculator.svg alt=Kalkulator></div><div class=app-btn id=note-btn><img class=app-icon src=icons/notepad.svg alt=Notatnik></div><div class=app-btn id=timer-btn><img class=app-icon src=icons/timer.svg alt=Timer></div><div class=app-btn id=settings-btn><img class=app-icon src=icons/settings.svg alt=Ustawienia></div></div><div class="glass-panel window"id=calc-win><div class=header id=calc-win-header>Calculator<div class=header-btn id=calc-close-btn>✕</div></div><input id=calc-input class=text-area readonly><div class=numpad id=calc-numpad><button class=num-btn>9</button> <button class=num-btn>8</button> <button class=num-btn>7</button> <button class=num-btn>+</button> <button class=num-btn>C</button> <button class=num-btn>6</button> <button class=num-btn>5</button> <button class=num-btn>4</button> <button class=num-btn>−</button> <button class="num-btn icon-symbol">⌫</button> <button class=num-btn>3</button> <button class=num-btn>2</button> <button class=num-btn>1</button> <button class=num-btn>✕</button> <button class="num-btn equals">=</button> <button class=num-btn>0</button> <button class=num-btn>.</button> <button class=num-btn>IDK</button> <button class=num-btn>÷</button></div></div><div class="glass-panel window"id=note-win><div class=header id=note-win-header>Notepad<div class=header-btn id=note-close-btn>✕</div></div><textarea id=note-textarea spellcheck=false type=text></textarea></div><div class="glass-panel window"id=timer-win><div class=header id=timer-win-header>Timer<div class=header-btn id=timer-close-btn>✕</div></div><div id=timer-display></div><div id=timer-menu><button class=timer-btn id=timer-start-btn><img class=timer-btn-icon src=icons/play.svg></button> <button class=timer-btn id=timer-pause-btn><img class=timer-btn-icon src=icons/pause.svg></button> <button class=tim
